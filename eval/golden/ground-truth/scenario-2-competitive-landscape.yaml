    pattern: "(高通|AMD|英特尔).*(收购|并购|控股)英伟达"
    why: "KG 中没有任何竞争对手收购/并购英伟达的事件。声称此点属于严重幻觉。"
  - id: fp_2
    pattern: "英伟达.*失去.*(微软|Meta|谷歌).*(订单|客户|合同)"
    why: "KG 中没有英伟达被任一大客户取消订单/失去客户的事件。虽然高通切入 MS/Meta，但 KG 没说英伟达被替代——把'竞争对手新进入'等同于'英伟达失去客户'是过度推断。"
